name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tms
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tms"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://tms:tms@localhost:5432/tms
      DJANGO_SECRET_KEY: ci-insecure-secret-min-32-bytes-long
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend-go/go.sum
      # runner 上没有中文字体，而水印测试守的正是「本机确实能渲染中文」。
      # 不装字体就只能把那条断言删掉，等于把生产上"静默不水印"的风险放行。
      - name: 安装 CJK 字体（水印测试需要）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-unifont
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Migrate（空库跑基线 + 增量，确保「从零建库」这条路没断）
        run: go run ./cmd/migrate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 镜像里的字体自检跑在 Dockerfile 的 RUN 里：没有可用 CJK 字体这一步就构建失败
      - name: Build gateway image
        run: docker build -t tms-gateway:ci backend-go
      # 不加管道：静态链接出问题时要让这步真的红，别被 head 的退出码吃掉
      - name: 冒烟：镜像里的二进制能跑起来
        run: docker run --rm --entrypoint /app/adminctl tms-gateway:ci -h
