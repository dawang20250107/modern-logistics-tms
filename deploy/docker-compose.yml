# 本地全栈编排。运行：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 变量缺省值已能直接跑；如需覆盖，复制 .env.example 为 .env（与本文件同目录）。
#
# Django 已退役：网关是唯一的应用进程，schema 由它内嵌的迁移器建立，
# 削峰与定时任务都在进程内，故不再需要 Redis 与 Celery 的 worker/beat。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tms}
      POSTGRES_USER: ${POSTGRES_USER:-tms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tms_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tms} -d ${POSTGRES_DB:-tms}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    image: tms-gateway:dev
    environment:
      GO_LISTEN_ADDR: ":8000"
      DATABASE_URL: ${DATABASE_URL:-postgres://tms:tms_dev_pwd@db:5432/tms}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me-min-32-bytes}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      MEDIA_ROOT: /app/media
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      ALERT_SPEED_LIMIT_KMH: ${ALERT_SPEED_LIMIT_KMH:-90}
      DEVICE_OFFLINE_MINUTES: ${DEVICE_OFFLINE_MINUTES:-10}
      AMAP_KEY: ${AMAP_KEY:-}
      AGENT_MCP_SERVERS: ${AGENT_MCP_SERVERS:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-tms/telemetry/#}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ../media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
