# 前端静态 + API 反代。TLS 在这里终止。
#
# 原先只有 `listen 80`：没有 443、没有证书、没有跳转。JWT 令牌、登录口令、
# 回单与证件照片全部明文过网；浏览器还会给密码框标"不安全"。
# B2B 系统交付时这一条会被第一个问到。
#
# 证书从 /etc/nginx/certs 读（compose 里挂进来）：
#   · 生产：云厂商签发的证书，或 certbot 签的 Let's Encrypt
#   · 本地预演：deploy/gen-dev-cert.sh 生成自签证书，浏览器会警告，属正常
# 没有证书文件时容器起不来——这是有意的，静默退回 HTTP 比起不来危险得多。

# HTTP：只做两件事——ACME 挑战 + 跳转 HTTPS
server {
    listen 80;
    server_name _;

    # certbot webroot 校验要走明文，不能跳转
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只留 TLS 1.2/1.3。1.0/1.1 已被主流浏览器弃用，留着只是给降级攻击留门。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：告诉浏览器这个域以后只走 https，省掉每次那一跳 301
    #（也就堵掉了那一跳里的中间人机会）。
    # 注意：includeSubDomains 会波及所有子域，确认子域都有证书再开。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容哈希，可以长缓存；index.html 不能，否则发版后用户拿到旧壳
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 网关 API / 探针 / 媒体（SSE 与 Django admin 已随 Django 一并下线）
    location ~ ^/(api|healthz|readyz|media)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端据此判断原始请求是不是 https。终止在这里，后端看到的是 http，
        # 少了这一行它会以为客户端在用明文。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
